name: hubcity_transit_flutter
description: "Hub City Transit Android app migrated from Next.js/TypeScript implementation."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  # Ships with the Flutter SDK, not a third-party package. Only reached through the
  # conditional import in core/platform/url_strategy.dart, so it never enters the
  # Android or iOS compile graph.
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  dio: ^5.9.2
  go_router: ^16.2.5
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  connectivity_plus: ^7.0.0
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  logger: ^2.6.2
  geolocator: ^14.0.2
  url_launcher: ^6.3.2
  google_fonts: ^8.1.0
  flutter_compass: ^0.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.9.0
  freezed: ^3.2.3
  json_serializable: ^6.11.1
  flutter_launcher_icons: ^0.14.4
  # flutter_native_splash is an author-time generator only; its output lives in
  # android/app/src/main/res. Kept out of the dependency graph because Flutter still
  # registers it in GeneratedPluginRegistrant while excluding dev-dependency plugins
  # from the release classpath, which breaks `flutter build appbundle --release`.
  # Re-add temporarily to regenerate splash assets from the config block below.

flutter:
  uses-material-design: true
  assets:
    - assets/data/routes_wgs84.json
    - assets/data/stops.json
    - assets/data/schedules.json
    - assets/data/transit.json
    - assets/data/announcements.json

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  web:
    generate: true
    image_path: "assets/app_icon.png"
    background_color: "#ffffff"
    theme_color: "#1976d2"
  image_path: "assets/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#ffffff"
  image: "assets/app_icon.png"
  android_12:
    image: "assets/app_icon.png"
    icon_background_color: "#ffffff"
  web: false
