<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Live bus tracking and trip planner for Hattiesburg, MS.">

  <!-- Without this a mobile browser assumes a ~980px desktop viewport and renders the whole app
       at roughly 37% scale. viewport-fit=cover is what lets env(safe-area-inset-*) resolve to
       real values behind the iOS home indicator. -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- Browser/PWA chrome colour. Two entries so it tracks the same system preference the Flutter
       theme follows; without them a dark-mode user gets light chrome around a dark app. -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAF9FC">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101418">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <!-- Deliberately not black-translucent. That draws the page under the status bar and relies on
       env(safe-area-inset-*) to pad it back, but Flutter's SafeArea reads MediaQuery.padding from
       the engine, and the web engine hardcodes ViewPadding.zero — so nothing would compensate. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Hub City Transit">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    /* The Flutter theme defaults to ThemeMode.system, so this splash has to follow
       prefers-color-scheme too. Otherwise a dark-mode visitor gets a white screen for the whole
       download-and-boot window, then a hard snap to dark on first frame. */
    :root {
      --splash-bg: #FAF9FC;
      --splash-logo-bg: #F5F3F7;
      --splash-ring: #C5C6CA;
      --splash-ink: #000101;
      --splash-on-ink: #FFFFFF;
      --splash-muted: #44474A;
      --splash-track: #C5C6CA;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --splash-bg: #101418;
        --splash-logo-bg: #1B2026;
        --splash-ring: #3A4048;
        --splash-ink: #E6E9EE;
        --splash-on-ink: #101418;
        --splash-muted: #A8AEB6;
        --splash-track: #3A4048;
      }
    }
    body {
      background-color: var(--splash-bg);
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .logo-container {
      width: 120px;
      height: 120px;
      background-color: var(--splash-logo-bg);
      border-radius: 50%;
      box-shadow: 0 12px 30px rgba(0, 1, 1, 0.12);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    .logo-ring {
      width: 90px;
      height: 90px;
      border: 3px solid var(--splash-ring);
      border-radius: 50%;
      position: absolute;
    }
    .logo-core {
      width: 60px;
      height: 60px;
      background-color: var(--splash-ink);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: absolute;
    }
    .logo-core svg {
      fill: var(--splash-on-ink);
      width: 28px;
      height: 28px;
    }
    .title {
      font-size: 32px;
      font-weight: 700;
      color: var(--splash-ink);
      margin-top: 28px;
      line-height: 1.1;
    }
    .subtitle {
      font-size: 16px;
      color: var(--splash-muted);
      margin-top: 10px;
    }
    .loading-label {
      font-size: 12px;
      letter-spacing: 0.8px;
      color: var(--splash-muted);
      margin-top: 48px;
      margin-bottom: 14px;
      text-transform: uppercase;
      font-weight: 600;
    }
    .progress-bar {
      width: 180px;
      height: 5px;
      background-color: var(--splash-track);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .progress-bar-fill {
      position: absolute;
      left: -100%;
      width: 50%;
      height: 100%;
      background-color: var(--splash-ink);
      border-radius: 999px;
      animation: progress-slide 1.5s ease-in-out infinite;
    }
    @keyframes progress-slide {
      0% { left: -50%; }
      100% { left: 150%; }
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <div class="splash-container" id="splash">
    <div class="logo-container">
      <div class="logo-ring"></div>
      <div class="logo-core">
        <svg xmlns="http://www.000101.com/svg" viewBox="0 0 24 24"><path d="M4,16c0,0.88,0.39,1.67,1,2.22V20c0,0.55,0.45,1,1,1h1c0.55,0,1-0.45,1-1v-1h8v1c0,0.55,0.45,1,1,1h1c0.55,0,1-0.45,1-1v-1.78 c0.61-0.55,1-1.34,1-2.22V6c0-3.5-3.58-4-8-4S4,2.5,4,6V16z M6.5,15.5c-0.83,0-1.5-0.67-1.5-1.5s0.67-1.5,1.5-1.5s1.5,0.67,1.5,1.5 S7.33,15.5,6.5,15.5z M17.5,15.5c-0.83,0-1.5-0.67-1.5-1.5s0.67-1.5,1.5-1.5s1.5,0.67,1.5,1.5S18.33,15.5,17.5,15.5z M6,11V6h12v5H6z"/></svg>
      </div>
    </div>
    <div class="title">Hub City<br>Transit</div>
    <div class="subtitle">Connecting the city, efficiently.</div>
    <div class="loading-label">INITIALIZING SYSTEM...</div>
    <div class="progress-bar">
      <div class="progress-bar-fill"></div>
    </div>
  </div>
  <script>
    // flutter_bootstrap.js handles initialization for Flutter >= 3.22
    // We remove the splash screen once the app is ready.
    window.addEventListener('flutter-first-frame', function() {
      var splash = document.getElementById('splash');
      if (splash) {
        splash.style.display = 'none';
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
